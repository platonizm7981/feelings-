<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>kubovsky / feelings</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(ellipse at 50% 45%, #1b1b1b 0%, #0b0b0b 48%, #050505 100%);
      color: #f1f1ed; font-family: Inter, Helvetica, Arial, sans-serif;
    }
    .grain { position: fixed; inset: 0; pointer-events: none; opacity: .09;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    }
    main { width: min(900px, 92vw); text-align: center; padding: 36px 16px; position: relative; }
    .brand { color: #888; font-size: 11px; letter-spacing: .42em; text-transform: uppercase; margin-bottom: 34px; }
    h1 { margin: 0 0 52px; font-size: clamp(34px, 7vw, 76px); font-weight: 500; letter-spacing: -.055em; }
    .timer { display: flex; justify-content: center; align-items: baseline; gap: clamp(14px, 4vw, 42px); font-variant-numeric: tabular-nums; }
    .unit { min-width: 0; }
    .number { font-size: clamp(48px, 12vw, 116px); line-height: 1; font-weight: 300; letter-spacing: -.075em; }
    .label { margin-top: 15px; color: #777; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; }
    .colon { color: #555; font-size: clamp(34px, 8vw, 75px); font-weight: 200; transform: translateY(-8px); }
    .date { margin-top: 58px; color: #777; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; }
    .line { width: 34px; height: 1px; background: #555; margin: 25px auto 0; }
    @media (max-width: 420px) { .brand { margin-bottom: 28px; } h1 { margin-bottom: 42px; } .timer { gap: 10px; } .label { letter-spacing: .18em; font-size: 9px; } }
  </style>
</head>
<body>
  <div class="grain"></div>
  <main>
    <div class="brand">KUBOVSKY</div>
    <h1>20 ноября — feelings</h1>
    <div class="timer" aria-label="Обратный отсчёт">
      <div class="unit"><div class="number" id="hours">000</div><div class="label">часов</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="number" id="minutes">00</div><div class="label">минут</div></div>
    </div>
    <div class="date">20 NOVEMBER · 00:00</div>
    <div class="line"></div>
  </main>
  <script>
    // Дата указана по местному времени устройства посетителя.
    const target = new Date(2026, 10, 20, 0, 0, 0);
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    function update() {
      const remaining = Math.max(0, target.getTime() - Date.now());
      const totalMinutes = Math.floor(remaining / 60000);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      hoursEl.textContent = String(hours).padStart(3, '0');
      minutesEl.textContent = String(minutes).padStart(2, '0');
      if (remaining === 0) document.querySelector('.date').textContent = 'FEELINGS IS HERE';
    }
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
